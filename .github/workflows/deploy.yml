name: Deploy Pondera HR to Production

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 89.111.152.49
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          command_timeout: 15m
          script: |
            echo "=== Starting Pondera HR Auto-Deploy ==="
            sysctl -w vm.swappiness=10 2>/dev/null || true
            cd /var/www/hr_pondera || cd /root/HR_Pondera || cd ~/HR_Pondera
            echo "Current directory: $(pwd)"
            git fetch origin main
            git reset --hard origin/main
            npm install
            npm run build
            cp -r .next/static .next/standalone/.next/ 2>/dev/null || true
            cp -r public .next/standalone/ 2>/dev/null || true
            pm2 restart hr-pondera || pm2 restart all
            echo "=== Auto-Deploy Completed Successfully ==="
