name: Deploy Pondera HR to Production

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Production Auto-Deploy Webhook
        run: |
          echo "=== Triggering Pondera HR Production Auto-Deploy ==="
          HTTP_CODE=$(curl -k -s -o /tmp/deploy_resp.json -w "%{http_code}" -X POST "https://hr.pondera.network/api/deploy?secret=pondera_hr_deploy_secret_2026")
          cat /tmp/deploy_resp.json || true
          echo ""
          echo "Webhook HTTP Status: $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "=== Auto-Deploy Triggered Successfully ==="
            exit 0
          fi
          echo "Webhook returned $HTTP_CODE, attempting fallback..."
          exit 0

